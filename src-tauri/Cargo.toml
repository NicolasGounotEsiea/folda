[package]
name = "nxs"
version = "0.1.14"
edition = "2021"

[lib]
name = "nxs_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
walkdir = "2"
zip = { version = "2", features = ["deflate"] }
tar = "0.4"
flate2 = "1"
notify = "6"
indexmap = "2"
anyhow = "1"
winreg = "0.52"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
tokio-tungstenite = "0.23"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tauri-plugin-drag = "2"
tauri-plugin-single-instance = "2"
# In-app updater. Signs releases with a private key (one-time setup, see
# docs/auto-update-setup.md), verifies signatures at download time, then
# replaces the running .exe and relaunches. Endpoint + public key live in
# tauri.conf.json's `plugins.updater` section.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
pdf-extract = "0.7"
regex-lite = "0.1"
# git2 bundled with vendored libgit2 + openssl so we don't depend on system git
# being installed. Adds ~3-4 MB to the release binary; the integration is
# opt-in via Settings → Git so non-dev users pay zero runtime cost when disabled.
git2 = { version = "0.19", default-features = false, features = ["vendored-libgit2"] }
# Pure-Rust diff algorithm. Used by the Notepad++-style "Compare files" feature.
# Tiny footprint (~50 KB), no transitive deps that pull anything heavy.
similar = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_System_Threading", "Win32_UI_Shell"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
