[package]
name = "nxs"
version = "0.1.18"
edition = "2021"

[lib]
name = "nxs_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
walkdir = "2"
zip = { version = "2", features = ["deflate"] }
tar = "0.4"
flate2 = "1"
notify = "6"
indexmap = "2"
anyhow = "1"
winreg = "0.52"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
tokio-tungstenite = "0.23"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# Noise Protocol Framework — used for the workspace-sharing handshake. We use
# pattern `Noise_NNpsk0_25519_ChaChaPoly_BLAKE2s`: no static keys (no PKI),
# password pre-shared as PSK at slot 0, X25519 ephemeral key exchange both
# sides (forward secrecy), ChaCha20-Poly1305 AEAD on the transport.
# See src/sharing/crypto.rs + src/sharing/frame.rs.
snow = "0.9"
# SHA-256 used to derive a 32-byte PSK from the share password so Noise gets
# the fixed-length key it expects. Tiny pure-Rust crate.
sha2 = "0.10"
# Cryptographically secure RNG for the share-session password. Replaces the
# previous xorshift64 + nanos-timestamp seed which was trivially brute-forceable
# given the session start time. OS-level entropy, no_std-compatible.
getrandom = "0.2"
# HTTP client for downloading Tesseract language packs (commands/ocr.rs).
# ALREADY compiled into the binary as tauri-plugin-updater's transitive dep
# (same 0.13, same rustls flavor) — declaring it directly adds ~zero build
# cost. default-features off: we only need TLS + async GET.
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
tauri-plugin-drag = "2"
tauri-plugin-single-instance = "2"
# In-app updater. Signs releases with a private key (one-time setup, see
# docs/auto-update-setup.md), verifies signatures at download time, then
# replaces the running .exe and relaunches. Endpoint + public key live in
# tauri.conf.json's `plugins.updater` section.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
pdf-extract = "0.7"
# lopdf is ALREADY a transitive dep of pdf-extract (same 0.34) — declaring it
# directly adds zero build cost. Used by commands/ocr.rs to pull embedded
# JPEGs (DCTDecode image XObjects) out of scanned PDFs for OCR without
# needing a full PDF rasterizer (pdfium/ghostscript).
lopdf = "0.34"
regex-lite = "0.1"
# git2 bundled with vendored libgit2 + openssl so we don't depend on system git
# being installed. Adds ~3-4 MB to the release binary; the integration is
# opt-in via Settings → Git so non-dev users pay zero runtime cost when disabled.
git2 = { version = "0.19", default-features = false, features = ["vendored-libgit2"] }
# Pure-Rust diff algorithm. Used by the Notepad++-style "Compare files" feature.
# Tiny footprint (~50 KB), no transitive deps that pull anything heavy.
similar = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_System_Threading", "Win32_UI_Shell"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
