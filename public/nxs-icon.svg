<?xml version="1.0" encoding="UTF-8"?>
<!--
  nxs app icon — Fluent (Windows 11) style.
  Front-facing folder with the brand "X" centered on a translucent acrylic
  front sheet. Wordmark omitted at icon scale (Fluent style — the silhouette
  + X carry the brand). Source: artwork preserved verbatim from the
  reference HTML mockup, viewBox 0 0 512 512.
-->
<!--
  viewBox tightened from 0 0 512 512 to 48 96 416 416 — the original artwork
  + ambient shadow only spans ~60% of the original canvas, so at small sizes
  (32 px taskbar) the icon looked visually smaller than neighbors like VS Code.
  This crop keeps the same artwork coordinates (no recompute needed) but
  scales 25% bigger on each axis when rasterized. Shadow tail is preserved
  inside the bottom margin; left/right/top padding stays balanced at ~11%.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="48 96 416 416" width="512" height="512">
  <defs>
    <!-- Folder back: deep brand blue, Fluent vibrancy -->
    <linearGradient id="folder-back" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%"   stop-color="#1f6fe0" />
      <stop offset="100%" stop-color="#0b46b8" />
    </linearGradient>

    <!-- Folder front sheet: brighter cyan-blue, acrylic -->
    <linearGradient id="folder-front" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#5ad0ff" />
      <stop offset="55%"  stop-color="#2f9bf2" />
      <stop offset="100%" stop-color="#1f7ae0" />
    </linearGradient>

    <!-- Acrylic top highlight on the front sheet -->
    <linearGradient id="front-sheen" x1="50%" y1="0%" x2="50%" y2="60%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- The nexus X gradient (white → ice, sits on the blue sheet) -->
    <linearGradient id="x-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cdecff" />
    </linearGradient>

    <!-- Soft Fluent ambient shadow -->
    <filter id="amb" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#06245c" flood-opacity="0.45" />
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" />
    </filter>
  </defs>

  <g filter="url(#amb)">
    <!-- Back panel with folder tab (top-left) -->
    <path d="M 132 150
             h 96
             a 22 22 0 0 1 16 7
             l 20 22
             h 100
             a 32 32 0 0 1 32 32
             v 140
             a 32 32 0 0 1 -32 32
             h -252
             a 32 32 0 0 1 -32 -32
             v -169
             a 32 32 0 0 1 32 -32 z"
          fill="url(#folder-back)" />

    <!-- Front acrylic sheet -->
    <g>
      <rect x="96" y="226" width="320" height="226" rx="34" ry="34"
            fill="url(#folder-front)" />
      <!-- Acrylic top sheen -->
      <rect x="96" y="226" width="320" height="120" rx="34" ry="34"
            fill="url(#front-sheen)" />
      <!-- Crisp 1px top light edge -->
      <path d="M 130 227 H 382"
            stroke="#ffffff" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round" />
    </g>
  </g>

  <!-- Nexus X — centered on the front sheet. Faint glow echo + main strokes. -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round" opacity="0.28" filter="url(#soft)">
    <path d="M 214 290 L 298 398" stroke-width="16" />
    <path d="M 298 290 L 214 398" stroke-width="16" />
  </g>
  <g fill="none" stroke="url(#x-grad)" stroke-width="17" stroke-linecap="round">
    <path d="M 214 290 L 298 398" />
    <path d="M 298 290 L 214 398" />
  </g>
</svg>
