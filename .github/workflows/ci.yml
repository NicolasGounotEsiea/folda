name: CI

on:
  push:
    branches: [main]
    # Don't double-run on release tags — the release workflow handles those
    tags-ignore:
      - "v*"
  pull_request:
    branches: [main]

jobs:
  # ── Type-check ────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx tsc --noEmit

  # ── Rust checks ───────────────────────────────────────────────────────────
  rust:
    name: Rust (check + clippy)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: cargo check
      - run: cargo clippy -- -D warnings

  # ── Production build (main only, saves CI minutes on PRs) ─────────────────
  build:
    name: Build installer (Windows)
    runs-on: windows-latest
    needs: [frontend, rust]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build Tauri app
        # `createUpdaterArtifacts` is on, so Tauri signs the bundles and REQUIRES
        # the private key — the same secrets the release workflow passes. Without
        # them the build fails at the signing step ("no private key"). Only runs
        # on direct pushes to main (see the job `if`), never on fork PRs, so the
        # secrets are always available here.
        run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 14
