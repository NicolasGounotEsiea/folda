name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name (e.g., v0.1.10) — must already exist in the repo'
        required: true
        type: string

jobs:
  release:
    name: Build & publish release (Windows)
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      # Centralize tag / version / prerelease so the rest of the workflow
      # doesn't need to keep coalescing inputs.tag_name vs github.ref_name.
      - name: Resolve tag
        id: tag
        shell: pwsh
        run: |
          $tag = if ($env:INPUT_TAG) { $env:INPUT_TAG } else { $env:GITHUB_REF_NAME }
          if ([string]::IsNullOrWhiteSpace($tag)) {
            Write-Error "No tag could be resolved from inputs or github.ref_name"
            exit 1
          }
          # Normalize: accept both `0.1.15` and `v0.1.15` as workflow_dispatch
          # input. Without this guard, typing the version without the `v`
          # makes actions/checkout try to fetch `refs/tags/0.1.15` which
          # doesn't exist — the trigger pattern is `v*` so the real tag is
          # always v-prefixed. Pure ergonomic fix, doesn't change behaviour
          # for tag-push triggers (github.ref_name always carries the `v`).
          if ($tag -notmatch '^v') {
            Write-Host "Input '$tag' missing leading 'v' — normalizing to 'v$tag'"
            $tag = "v$tag"
          }
          $version = $tag -replace '^v', ''
          $isPrerelease = if ($tag -match '-') { 'true' } else { 'false' }
          "tag=$tag"                     >> $env:GITHUB_OUTPUT
          "version=$version"             >> $env:GITHUB_OUTPUT
          "is_prerelease=$isPrerelease"  >> $env:GITHUB_OUTPUT
          Write-Host "Tag:           $tag"
          Write-Host "Version:       $version"
          Write-Host "Is prerelease: $isPrerelease"
        env:
          INPUT_TAG: ${{ inputs.tag_name }}

      # Check out the TAG, not the branch the workflow was launched from.
      # On push: github.ref_name is the tag, so this is equivalent to before.
      # On workflow_dispatch: github.ref_name is the source branch (e.g. main),
      # which would silently build the wrong code. Using the resolved tag fixes that.
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      # Pull just the section of CHANGELOG.md matching this version.
      # Falls back to the full CHANGELOG if no matching section is found, so
      # the release always has SOME body rather than silently shipping empty.
      - name: Extract release notes from CHANGELOG
        id: notes
        shell: pwsh
        run: |
          $version = '${{ steps.tag.outputs.version }}'
          if (-not (Test-Path CHANGELOG.md)) {
            "No CHANGELOG.md found in the repository." | Out-File release-notes.md -Encoding utf8
            Write-Warning "CHANGELOG.md missing"
            exit 0
          }
          $content = Get-Content CHANGELOG.md -Raw
          $escaped = [regex]::Escape($version)
          # Matches "## [VERSION]" header + everything up to the next "## [" header (or EOF).
          $pattern = "(?ms)^## \[$escaped\][^\r\n]*\r?\n(.*?)(?=\r?\n## \[|\z)"
          $m = [regex]::Match($content, $pattern)
          if ($m.Success) {
            $section = $m.Groups[1].Value.Trim()
            $section | Out-File release-notes.md -Encoding utf8
            Write-Host "Extracted CHANGELOG section for version $version ($($section.Length) chars)"
          } else {
            Write-Warning "No CHANGELOG section found for version $version — falling back to full CHANGELOG"
            Copy-Item CHANGELOG.md release-notes.md
          }

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build Tauri app
        # When the two signing secrets are configured in the repo, Tauri
        # auto-signs each bundle artifact and writes a `.sig` file next to
        # the installer — those signatures are what the in-app updater
        # verifies before replacing the running .exe. When the secrets are
        # missing (typical for the very first release after this change),
        # the build still succeeds, but no .sig files are produced and the
        # manifest step below logs a warning and skips manifest upload.
        run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Collect artifacts
        id: artifacts
        shell: pwsh
        run: |
          $msi  = Get-ChildItem src-tauri/target/release/bundle/msi/*.msi  | Select-Object -First 1
          $nsis = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          if (-not $msi)  { Write-Error "No MSI installer found in src-tauri/target/release/bundle/msi/";  exit 1 }
          if (-not $nsis) { Write-Error "No NSIS installer found in src-tauri/target/release/bundle/nsis/"; exit 1 }
          "MSI=$($msi.FullName)"        >> $env:GITHUB_OUTPUT
          "NSIS=$($nsis.FullName)"      >> $env:GITHUB_OUTPUT
          "MSI_NAME=$($msi.Name)"       >> $env:GITHUB_OUTPUT
          "NSIS_NAME=$($nsis.Name)"     >> $env:GITHUB_OUTPUT
          "MSI_SIZE_MB=$([math]::Round($msi.Length / 1MB, 2))"   >> $env:GITHUB_OUTPUT
          "NSIS_SIZE_MB=$([math]::Round($nsis.Length / 1MB, 2))" >> $env:GITHUB_OUTPUT
          Write-Host "MSI:  $($msi.Name) ($([math]::Round($msi.Length / 1MB, 2)) MB)"
          Write-Host "NSIS: $($nsis.Name) ($([math]::Round($nsis.Length / 1MB, 2)) MB)"

      # Build a `latest.json` manifest that the in-app updater polls.
      # Tauri's bundler drops `<installer>.sig` next to each artifact when
      # the signing env vars are set. We read the NSIS one (the in-app
      # updater installs via NSIS in passive mode — see tauri.conf.json's
      # `plugins.updater.windows.installMode`), then build the JSON the
      # updater plugin expects: version, notes, pub_date, plus a single
      # `platforms.windows-x86_64` entry with the signature + download URL.
      # The download URL is the public release asset URL — same domain as
      # the manifest endpoint, no CORS or auth gymnastics needed.
      - name: Generate latest.json manifest
        id: manifest
        shell: pwsh
        run: |
          $nsisSig = "${{ steps.artifacts.outputs.NSIS }}.sig"
          if (-not (Test-Path $nsisSig)) {
            Write-Warning "No .sig file found at $nsisSig — signing secrets not configured. Skipping manifest generation."
            Write-Warning "In-app updater will NOT work for this release. Configure TAURI_SIGNING_PRIVATE_KEY{,_PASSWORD} in repo secrets to enable it."
            "skipped=true" >> $env:GITHUB_OUTPUT
            exit 0
          }
          $signature = Get-Content $nsisSig -Raw
          $notes = if (Test-Path release-notes.md) { Get-Content release-notes.md -Raw } else { "" }
          $pubDate = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $repo = "${{ github.repository }}"
          $tag = "${{ steps.tag.outputs.tag }}"
          $nsisName = "${{ steps.artifacts.outputs.NSIS_NAME }}"
          $downloadUrl = "https://github.com/$repo/releases/download/$tag/$nsisName"
          $manifest = @{
            version   = "${{ steps.tag.outputs.version }}"
            notes     = $notes.Trim()
            pub_date  = $pubDate
            platforms = @{
              "windows-x86_64" = @{
                signature = $signature.Trim()
                url       = $downloadUrl
              }
            }
          }
          # PowerShell's ConvertTo-Json depth defaults to 2 which truncates
          # our nested platforms object — bump to 10 to be safe. UTF-8 no-BOM
          # so the updater plugin's JSON parser doesn't choke on the BOM.
          $json = $manifest | ConvertTo-Json -Depth 10
          [System.IO.File]::WriteAllText("$PWD\latest.json", $json, [System.Text.UTF8Encoding]::new($false))
          Write-Host "Generated latest.json:"
          Get-Content latest.json
          "skipped=false" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: nxs ${{ steps.tag.outputs.tag }}
          body_path: release-notes.md
          draft: false
          prerelease: ${{ steps.tag.outputs.is_prerelease == 'true' }}
          # `latest.json` is attached only when signing was actually performed
          # — if signing was skipped (no secrets), it never exists, and the
          # softprops/action-gh-release upload globs the listed paths
          # tolerantly when one of them is missing.
          files: |
            ${{ steps.artifacts.outputs.MSI }}
            ${{ steps.artifacts.outputs.NSIS }}
            ${{ steps.manifest.outputs.skipped == 'false' && 'latest.json' || '' }}

      # Visible in the Actions tab's Summary view — quick at-a-glance verification
      # without clicking through individual step logs.
      - name: Job summary
        if: always()
        shell: pwsh
        run: |
          $prerelease = '${{ steps.tag.outputs.is_prerelease }}'
          $badge = if ($prerelease -eq 'true') { ':warning: prerelease' } else { ':rocket: stable' }
          @"
          ## Release ${{ steps.tag.outputs.tag }} — $badge

          | Artifact | Size |
          |---|---|
          | ${{ steps.artifacts.outputs.MSI_NAME }} | ${{ steps.artifacts.outputs.MSI_SIZE_MB }} MB |
          | ${{ steps.artifacts.outputs.NSIS_NAME }} | ${{ steps.artifacts.outputs.NSIS_SIZE_MB }} MB |

          - Trigger: ``${{ github.event_name }}``
          - Version: ``${{ steps.tag.outputs.version }}``
          - Built from: ``${{ steps.tag.outputs.tag }}``
          "@ | Out-File -Append $env:GITHUB_STEP_SUMMARY -Encoding utf8
